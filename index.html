<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8d2f12">
  <meta name="description" content="हनुमान जी का प्रेम भरा संदेश — राम राम।">
  <title>राम राम | जय हनुमान</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans Devanagari", "Mangal", "Kohinoor Devanagari", sans-serif;
      background: #fff6e8;
      color: #542212;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #fffdf7 0, #fff5e4 48%, #f9dfbd 100%);
    }

    .page {
      position: relative;
      width: min(100% - 32px, 720px);
      padding: 64px 28px 52px;
      text-align: center;
      isolation: isolate;
    }

    .page::before,
    .page::after {
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 50%;
      width: min(82vw, 500px);
      aspect-ratio: 1;
      border: 1px solid rgb(201 119 39 / 18%);
      border-radius: 50%;
      content: "";
      transform: translate(-50%, -50%);
    }

    .page::after {
      width: min(68vw, 410px);
      border-style: dashed;
      animation: turn 90s linear infinite;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: #a54b1b;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    .hanuman {
      display: inline-grid;
      width: 116px;
      height: 116px;
      place-items: center;
      margin-bottom: 24px;
      border: 1px solid rgb(255 255 255 / 75%);
      border-radius: 50%;
      background: linear-gradient(145deg, #ffd37f, #f28c32);
      box-shadow: 0 12px 32px rgb(150 67 22 / 20%), inset 0 0 0 7px rgb(255 255 255 / 22%);
      font-size: 62px;
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      color: #9b3218;
      font-size: clamp(56px, 13vw, 100px);
      font-weight: 800;
      line-height: 1.3;
      text-shadow: 0 3px 0 #f6d4a4;
    }

    .message {
      margin: 8px 0 0;
      color: #73371f;
      font-size: clamp(20px, 5vw, 28px);
      line-height: 1.8;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 28px auto 22px;
      color: #c57a31;
      font-size: 20px;
    }

    .divider::before,
    .divider::after {
      width: 54px;
      height: 1px;
      background: #d8a66e;
      content: "";
    }

    .blessing {
      margin: 0;
      color: #955123;
      font-size: 17px;
      line-height: 1.9;
    }

    .chant {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 26px;
      border: 1px solid #e5b678;
      border-radius: 999px;
      background: rgb(255 255 255 / 65%);
      color: #a13d1a;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .sparkle {
      position: absolute;
      color: #df9c43;
      font-size: 24px;
      animation: glow 2.5s ease-in-out infinite alternate;
    }

    .sparkle-one {
      top: 23%;
      left: 12%;
    }

    .sparkle-two {
      top: 31%;
      right: 10%;
      animation-delay: 0.8s;
    }

    .sparkle-three {
      right: 17%;
      bottom: 17%;
      font-size: 18px;
      animation-delay: 1.4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes glow {
      from { opacity: 0.5; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.12); }
    }

    @keyframes turn {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
    <span class="sparkle sparkle-two" aria-hidden="true">✧</span>
    <span class="sparkle sparkle-three" aria-hidden="true">✦</span>

    <p class="eyebrow">॥ श्री हनुमते नमः ॥</p>
    <div class="hanuman" role="img" aria-label="हनुमान जी">🙏</div>
    <h1>राम राम</h1>
    <p class="message">हनुमान जी की ओर से आपको प्रेम भरा अभिवादन</p>
    <div class="divider" aria-hidden="true">ॐ</div>
    <p class="blessing">बजरंगबली आपकी हर राह को शक्ति, साहस<br>और मंगल से भर दें।</p>
    <div class="chant">जय श्री राम · जय हनुमान</div>
  </main>
</body>
</html>
