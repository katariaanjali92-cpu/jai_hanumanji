<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8d2f12">
  <meta name="description" content="हनुमान जी का प्रेम भरा संदेश — राम राम।">
  <title>राम राम | जय हनुमान</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans Devanagari", "Mangal", "Kohinoor Devanagari", sans-serif;
      background: #fff6e8;
      color: #542212;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #fffdf7 0, #fff5e4 48%, #f9dfbd 100%);
    }

    .page {
      position: relative;
      width: min(100% - 32px, 720px);
      padding: 64px 28px 52px;
      text-align: center;
      isolation: isolate;
    }

    .page::before,
    .page::after {
      position: absolute;
      z-index: -1;
      top: 50%;
      left: 50%;
      width: min(82vw, 500px);
      aspect-ratio: 1;
      border: 1px solid rgb(201 119 39 / 18%);
      border-radius: 50%;
      content: "";
      transform: translate(-50%, -50%);
    }

    .page::after {
      width: min(68vw, 410px);
      border-style: dashed;
      animation: turn 90s linear infinite;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: #a54b1b;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2em;
    }

    .hanuman {
      display: block;
      width: 150px;
      height: 150px;
      margin-bottom: 24px;
      overflow: visible;
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      color: #9b3218;
      font-size: clamp(56px, 13vw, 100px);
      font-weight: 800;
      line-height: 1.3;
      text-shadow: 0 3px 0 #f6d4a4;
    }

    .message {
      margin: 8px 0 0;
      color: #73371f;
      font-size: clamp(20px, 5vw, 28px);
      line-height: 1.8;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 28px auto 22px;
      color: #c57a31;
      font-size: 20px;
    }

    .divider::before,
    .divider::after {
      width: 54px;
      height: 1px;
      background: #d8a66e;
      content: "";
    }

    .blessing {
      margin: 0;
      color: #955123;
      font-size: 17px;
      line-height: 1.9;
    }

    .chant {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 26px;
      border: 1px solid #e5b678;
      border-radius: 999px;
      background: rgb(255 255 255 / 65%);
      color: #a13d1a;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .sparkle {
      position: absolute;
      color: #df9c43;
      font-size: 24px;
      animation: glow 2.5s ease-in-out infinite alternate;
    }

    .sparkle-one {
      top: 23%;
      left: 12%;
    }

    .sparkle-two {
      top: 31%;
      right: 10%;
      animation-delay: 0.8s;
    }

    .sparkle-three {
      right: 17%;
      bottom: 17%;
      font-size: 18px;
      animation-delay: 1.4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes glow {
      from { opacity: 0.5; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.12); }
    }

    @keyframes turn {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
    <span class="sparkle sparkle-two" aria-hidden="true">✧</span>
    <span class="sparkle sparkle-three" aria-hidden="true">✦</span>

    <p class="eyebrow">॥ श्री हनुमते नमः ॥</p>
    <svg class="hanuman" viewBox="0 0 160 160" role="img" aria-labelledby="hanuman-title">
      <title id="hanuman-title">हनुमान जी का चित्र</title>
      <defs>
        <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffe3a5"/>
          <stop offset="1" stop-color="#f28c32"/>
        </linearGradient>
        <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe28b"/>
          <stop offset="1" stop-color="#d98216"/>
        </linearGradient>
      </defs>
      <circle cx="80" cy="80" r="76" fill="url(#aura)"/>
      <circle cx="80" cy="80" r="69" fill="none" stroke="#fff5d9" stroke-width="2" opacity=".8"/>
      <path d="M119 110c22-10 31 5 20 19-5 6-13 7-19 3" fill="none" stroke="#a94a19" stroke-width="5" stroke-linecap="round"/>
      <path d="M131 91v34" stroke="#71371e" stroke-width="5" stroke-linecap="round"/>
      <path d="M124 93c0-8 14-8 14 0l-2 5h-10z" fill="#e6a52d" stroke="#71371e" stroke-width="2"/>
      <path d="M127 127h9l4 7h-17z" fill="#e6a52d" stroke="#71371e" stroke-width="2"/>
      <path d="M43 137c3-22 16-32 37-32s34 10 37 32" fill="#bd4d20" stroke="#71371e" stroke-width="3"/>
      <path d="M59 115l21 16 21-16" fill="none" stroke="#f6cf68" stroke-width="4"/>
      <path d="M62 43 55 19l18 12 7-20 8 20 18-12-7 25" fill="url(#crown)" stroke="#71371e" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="80" cy="17" r="5" fill="#c84321"/>
      <path d="M49 54c-12-7-18 4-13 16 3 7 9 9 15 7m58-23c12-7 18 4 13 16-3 7-9 9-15 7" fill="#f4bd83" stroke="#71371e" stroke-width="3"/>
      <path d="M53 48c8-11 46-11 54 0l5 35c1 21-13 35-32 35S47 104 48 83z" fill="#f4bd83" stroke="#71371e" stroke-width="3"/>
      <path d="M70 71c4-3 8-3 12 0m8 0c4-3 8-3 12 0" fill="none" stroke="#71371e" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="72" cy="78" rx="3" ry="4" fill="#3b2419"/>
      <ellipse cx="96" cy="78" rx="3" ry="4" fill="#3b2419"/>
      <path d="M84 80l-5 13 8 2" fill="none" stroke="#a94a19" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="85" cy="101" rx="16" ry="10" fill="#ffe0b5" stroke="#71371e" stroke-width="2"/>
      <path d="M78 102h14" stroke="#71371e" stroke-width="2" stroke-linecap="round"/>
      <path d="M83 54v13m0-7h6" stroke="#c5291e" stroke-width="4" stroke-linecap="round"/>
      <path d="M69 112c7 5 17 5 24 0" fill="none" stroke="#e6a52d" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>राम राम</h1>
    <p class="message">हनुमान जी की ओर से आपको प्रेम भरा अभिवादन</p>
    <div class="divider" aria-hidden="true">ॐ</div>
    <p class="blessing">बजरंगबली आपकी हर राह को शक्ति, साहस<br>और मंगल से भर दें।</p>
    <div class="chant">जय श्री राम · जय हनुमान</div>
  </main>
</body>
</html>
